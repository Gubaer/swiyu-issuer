# Carried over from the swiyu-rs workspace: clang + mold give noticeably
# faster link times. The api/Dockerfile installs both so the release build
# honours this; local builds need `clang` and `mold` on PATH.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
split-debuginfo = "unpacked"
debug = 1
