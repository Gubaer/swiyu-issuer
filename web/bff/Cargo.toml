[package]
name = "swiyu-issuer-web-bff"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dashmap = "6"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swiyu-core = { git = "https://github.com/Gubaer/swiyu-rs.git", tag = "shared-crates-2026-06-01" }
swiyu-registries = { git = "https://github.com/Gubaer/swiyu-rs.git", tag = "shared-crates-2026-06-01", features = ["identifier"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tower-sessions = "0.14"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
